[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adb-query-mcp"
version = "0.1.0"
description = "Fixed-target, read-only ADB queries over MCP stdio"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==1.30.0", "pydantic==2.14.1", "anyio==4.15.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.0", "setuptools==80.9.0"]

[project.scripts]
adb-query-mcp = "adb_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
